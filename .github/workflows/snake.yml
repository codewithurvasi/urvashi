name: Generate Snake

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate Creative DNA style animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ROHIT-RICH
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#00f5ff,#8a2be2,#00ff88&color_dots=#0f172a,#1e293b,#334155,#475569,#64748b
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00f5ff,#8a2be2,#00ff88

      - name: Deploy to output branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: output
          folder: dist
          clean: true
          token: ${{ secrets.GITHUB_TOKEN }}
